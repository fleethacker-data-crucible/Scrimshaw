<text x="60" y="70" fill="#e2b04a" font-size="22" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start" letter-spacing="6">HOW SCRIMSHAW WORKS</text>
<text x="60" y="128" fill="#e8edf5" font-size="50" font-weight="700" font-family="Georgia, 'Times New Roman', serif" text-anchor="start">Scrimshaw: architecture at a glance</text>
<text x="60" y="168" fill="#aab7ca" font-size="26" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">A course is built by hand on one computer, reviewed by a person, and published as a package an LMS can track.</text>
